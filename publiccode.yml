description:
  en:
    localisedName: jeap-spring-modulith-error-handling-starter
    shortDescription: A Spring Boot starter for handling failed Spring Modulith event publications.
    longDescription: >
      The starter applies a persistent retry policy to Spring Modulith event publications and integrates exhausted
      failures with the jEAP Error Handling Service. Operators can retry or discard an individual publication through
      the existing error-handling workflow.
    features:
      - Persistent retries for failed Spring Modulith event publications.
      - Escalation of exhausted publications to the jEAP Error Handling Service.
      - Commands for retrying or discarding individual publications.
